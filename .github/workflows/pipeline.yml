name: Pipeline

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

env:
  LINK: http://localhost:8085
  TEST_PASS: ${{ secrets.TEST_PASS }}
  PUBLIC_POLL_VERSION: 2

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flowback_test
          POSTGRES_USER: flowback
          POSTGRES_PASSWORD: flowback
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      FLOWBACK_PSQL_NAME: flowback_test
      FLOWBACK_PSQL_USER: flowback
      FLOWBACK_PSQL_PASSWORD: flowback
      FLOWBACK_PSQL_HOST: localhost
      FLOWBACK_PSQL_PORT: "5432"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Start Celery worker and beat
        run: |
          celery -A backend worker --loglevel=info &
          celery -A backend beat --loglevel=info &

      - name: Run tests
        run: pytest --disable-warnings

  build:
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flowback-backend:latest

  frontend-tests:
    needs: build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout flowback-docker
        uses: actions/checkout@v4
        with:
          repository: Kattenelvis/flowback-docker
          path: flowback-docker

      - name: Start Flowback stack
        working-directory: flowback-docker
        run: |
          docker compose pull
          docker compose up -d

      - name: Checkout interface tests
        uses: actions/checkout@v4
        with:
          repository: Kattenelvis/flowback-interface-testing
          path: flowback-interface-testing

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: flowback-interface-testing
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: flowback-interface-testing
        run: npx playwright install --with-deps chromium

      - name: Run Smoke tests (basic login functionality)
        working-directory: flowback-interface-testing
        run: npx playwright test -g "Smoke-Test" --project chromium --retries 1
          --workers 1

      - name: Run the rest of the tests
        working-directory: flowback-interface-testing
        run: npx playwright test . --project chromium --retries 2 --workers 3 --reporter list
          --grep-invert "Smoke-Test"

      - name: Dump docker logs on failure
        if: ${{ failure() }}
        working-directory: flowback-docker
        run: docker compose logs

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: flowback-interface-testing/playwright-report/
          retention-days: 30

  publish-dev:
    needs: frontend-tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            cd flowback/flowback-docker-testing
            docker compose pull && docker compose up -d

  # Works only on main branch
  publish-prod:
    needs: publish-dev
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            cd flowback/flowback-docker-prod
            docker compose pull && docker compose up -d
